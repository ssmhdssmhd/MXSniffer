services:
  lightpanda:
    image: lightpanda/browser:latest
    restart: unless-stopped
    environment:
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    expose:
      - "9222"

  mxsniffer:
    build: .
    restart: unless-stopped
    depends_on:
      - lightpanda
    environment:
      LIGHTPANDA_WS_URL: ws://lightpanda:9222
    ports:
      - "1314:1314"
